apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-operator-controller-manager
  namespace: seaweedfs-system
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-operator-metrics
  namespace: seaweedfs-system
  labels:
    app.kubernetes.io/name: seaweedfs-operator
spec:
  selector:
    app.kubernetes.io/name: seaweedfs-operator
    control-plane: controller-manager
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-operator-controller-manager
  namespace: seaweedfs-system
  labels:
    app.kubernetes.io/name: seaweedfs-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-operator
        control-plane: controller-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: seaweedfs-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: IMAGE_PLACEHOLDER
          args:
            # Leader election is on even at one replica so a rolling update
            # cannot briefly run two managers against the same clusters.
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
