kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Expose the SeaweedFS S3 NodePort so the e2e suite can reach it from the
    # host without port-forwarding.
    extraPortMappings:
      - containerPort: 30333
        hostPort: 30333
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/region: local
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/region: local
      topology.kubernetes.io/zone: zone-b
