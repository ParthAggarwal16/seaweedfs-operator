              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ObjectStorageBucketSpec is the desired state of an S3 bucket.
            properties:
              bucketName:
                description: |-
                  BucketName is the S3 bucket name. Defaults to .metadata.name. Set it
                  explicitly when the desired bucket name is not a legal Kubernetes object
                  name, or when several namespaces need distinctly-named buckets.
                pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
