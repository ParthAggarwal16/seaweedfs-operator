                format: date-time
                type: string
              endpoint:
                description: Endpoint is the S3 endpoint serving this bucket.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase summarises the bucket state.
