              clusterRef:
                description: |-
                  ClusterRef names the ObjectStorageCluster that should host this bucket.
                  The cluster must live in the same namespace.
                properties:
                  name:
                    description: Name of the ObjectStorageCluster.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              connectionSecretName:
                description: |-
                  ConnectionSecretName asks the operator to write a Secret with the
                  bucket's connection details (endpoint, region, bucket name). It carries
                  no credentials — those come from an ObjectStorageUser. Handy for
                  mounting as envFrom in a consuming workload.
                type: string
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy decides whether deleting this object also deletes the
                  bucket and everything in it. The default is Retain precisely because the
                  destructive option should be a conscious choice.
                enum:
                - Delete
                - Retain
                type: string
              objectLockEnabled:
                description: |-
                  ObjectLockEnabled requests S3 object lock on bucket creation. It can only
                  be set at creation time; changing it later has no effect.
